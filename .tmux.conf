set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable true color support for compatible terminals.
# set-option -ga terminal-overrides ",xterm:Tc"

# Enable terminal focus events for editor integrations (e.g., Neovim).
set-option -g focus-events on

# Enable mouse support for pane selection, resizing, and scrolling.
set -g mouse on
set -s extended-keys on  # Enable extended keys for better keybinding support

# Prefix
unbind C-b
set -g prefix `
bind ` send-prefix

# set vi-mode for window selection
set-window-option -g mode-keys vi

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Window buttons
set -g window-status-format "#[fg=colour67]•"
set -g window-status-current-format "#{?window_zoomed_flag,#[fg=colour220],#[fg=colour39]}•"
set -g window-status-bell-style "fg=colour196,nobold"

# Pane borders
set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=yellow

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# sets new pane in cwd
bind '=' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind f resize-pane -Z

# Status bar
set -g status-style bg=default,fg=black,bright 
set -g status-left "" 
set -g status-right "#[fg=black, bright]#S"

# Extend Keys SUpport
set -g extended-keys on
set -g extended-keys-format csi-u

# Ghostty Extended Keys support
set -as terminal-features "xterm-ghostty:extkeys,cstyle"
